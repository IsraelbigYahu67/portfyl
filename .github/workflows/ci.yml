name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lock:
    name: Backend (lock is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Re-resolving against the committed lock keeps every pin that still
      # satisfies requirements*.txt, so a clean diff means the lock files match
      # the input specs. Refresh them with the commands in CLAUDE.md.
      - name: Check requirements*.lock match requirements*.txt
        run: |
          python -m pip install uv
          uv pip compile backend/requirements.txt --universal --generate-hashes --python-version 3.12 -o backend/requirements.lock
          uv pip compile backend/requirements-dev.txt --universal --generate-hashes --python-version 3.12 -c backend/requirements.lock -o backend/requirements-dev.lock
          git diff --exit-code -- backend/requirements.lock backend/requirements-dev.lock

  backend-fast:
    name: Backend (fast suite, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the dev interpreter (start.bat); 3.14 is what the Dockerfile
        # ships. Both run until dev moves to 3.14 (plan R2).
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: Run fast backend suite
        working-directory: backend
        run: python -m pytest tests/ -v --ignore=tests/postgres

  backend-postgres:
    name: Backend (PostgreSQL/RLS integration suite, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfyl_test
          POSTGRES_USER: portfyl_test
          POSTGRES_PASSWORD: portfyl_test
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U portfyl_test -d portfyl_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: Run PostgreSQL/RLS integration suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://portfyl_test:portfyl_test@localhost:55441/portfyl_test
        run: python -m pytest tests/postgres/ -v

  frontend:
    name: Frontend (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [local, cloud]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm run ${{ matrix.edition == 'cloud' && 'test:cloud' || 'test' }}
      - name: Test initial bundle measurement
        working-directory: frontend
        run: node --test scripts/measure-initial-bundle.test.mjs
      - name: Test readability audit script
        working-directory: frontend
        run: node --test scripts/audit-readability.test.mjs
      - name: Readability audit
        working-directory: frontend
        run: npm run audit:readability
      - name: Production build
        working-directory: frontend
        run: npm run ${{ matrix.edition == 'cloud' && 'build:cloud' || 'build' }}
