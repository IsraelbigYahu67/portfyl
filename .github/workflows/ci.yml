name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-fast:
    name: Backend (fast suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run fast backend suite
        working-directory: backend
        run: python -m pytest tests/ -v --ignore=tests/postgres

  backend-postgres:
    name: Backend (PostgreSQL/RLS integration suite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfyl_test
          POSTGRES_USER: portfyl_test
          POSTGRES_PASSWORD: portfyl_test
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U portfyl_test -d portfyl_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run PostgreSQL/RLS integration suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://portfyl_test:portfyl_test@localhost:55441/portfyl_test
        run: python -m pytest tests/postgres/ -v

  frontend:
    name: Frontend (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [local, cloud]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm run ${{ matrix.edition == 'cloud' && 'test:cloud' || 'test' }}
      - name: Test initial bundle measurement
        working-directory: frontend
        run: node --test scripts/measure-initial-bundle.test.mjs
      - name: Production build
        working-directory: frontend
        run: npm run ${{ matrix.edition == 'cloud' && 'build:cloud' || 'build' }}
