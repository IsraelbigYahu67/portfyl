# Own project name: without it both this file and docker-compose.postgres-dev.yml
# resolve to the project "deploy" with a service "postgres", and starting one
# silently replaces the other's container (the test config over the dev volume).
name: portfyl-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: portfyl_test
      POSTGRES_USER: portfyl_test
      POSTGRES_PASSWORD: portfyl_test
    ports:
      - "55441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfyl_test -d portfyl_test"]
      interval: 2s
      timeout: 5s
      retries: 15
