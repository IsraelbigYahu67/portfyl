services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: portfyl_dev
      POSTGRES_USER: portfyl_dev
      POSTGRES_PASSWORD: portfyl_dev
    ports:
      # Host port 15432 is below Windows' dynamic port range (49152+), so Hyper-V/WinNAT
      # can never reserve it. 55432 was reserved on some boots and Docker failed to bind.
      - "15432:5432"
    volumes:
      - portfyl_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfyl_dev -d portfyl_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  portfyl_dev_pgdata:
