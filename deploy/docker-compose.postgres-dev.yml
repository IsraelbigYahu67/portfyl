services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: portfyl_dev
      POSTGRES_USER: portfyl_dev
      POSTGRES_PASSWORD: portfyl_dev
    ports:
      - "55432:5432"
    volumes:
      - portfyl_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfyl_dev -d portfyl_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  portfyl_dev_pgdata:
